# Security headers of the page and its static files. Included in every location that serves them:
# an add_header inside a location drops all the ones inherited from the server block.
# The API sets its own (helmet), so the /api locations do not include this.

# Scripts only from the app itself. Styles may be inline: React and framer-motion write style
# attributes and the toasts inject a <style>. Images: own files, uploads (/api/assets), avatars kept
# in the document as data: URLs, and blob: previews of a picked file. The realtime socket is on the
# same host; ws:/wss: are named for browsers whose 'self' does not cover them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
# Only over HTTPS (behind a TLS proxy that says so); an empty value sends nothing.
add_header Strict-Transport-Security $hsts always;
