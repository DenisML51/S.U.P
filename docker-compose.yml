name: into-the-dark

# Full stack: http://localhost:3000 (web + /api proxy).
# Copy .env.example to .env and set JWT_SECRET before the first start.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itd}
      POSTGRES_DB: ${POSTGRES_DB:-into_the_dark}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Published on localhost only, for local development and tests.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-itd}:${POSTGRES_PASSWORD:-itd}@postgres:5432/${POSTGRES_DB:-into_the_dark}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Secure cookies need HTTPS. Plain http://localhost works either way; set true behind TLS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The API is reachable only through the web container's proxy.
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
